<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Task — Trusted help. Right now.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Firebase (compat SDKs — simplest to wire up, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --ink:#14142B;
  --ink-2:#22224a;
  --cream:#F7F2E7;
  --paper:#FFFFFF;
  --amber:#FF9F1C;
  --amber-dark:#E08600;
  --teal:#0F9B8E;
  --teal-dark:#0B7D72;
  --coral:#E85C4A;
  --line:#EAE3D2;
  --muted:#8A8577;
  --radius:16px;
  --shadow-sm:0 1px 2px rgba(20,20,43,.05), 0 2px 8px rgba(20,20,43,.05);
  --shadow-md:0 4px 14px rgba(20,20,43,.09), 0 1px 3px rgba(20,20,43,.06);
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);}
#app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:86px;}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;}
button:active{transform:scale(.97);}
input,select,textarea{font-family:inherit;}
::selection{background:var(--amber);color:var(--ink);}

/* --- Top ticker bar --- */
.ticker{background:var(--ink);background-image:linear-gradient(120deg,var(--ink),var(--ink-2));color:var(--cream);display:flex;justify-content:space-between;align-items:center;padding:9px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.03em;}
.ticker .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-right:5px;box-shadow:0 0 0 3px rgba(15,155,142,.3);}

/* --- Header --- */
.topbar{padding:16px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:10px;}
.brand h1{font-size:19px;margin:0;letter-spacing:-.01em;}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;font-size:16px;}

.container{padding:0 16px;}

/* --- Cards --- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow-sm);}
.stat .n{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}

/* --- Buttons --- */
.btn{padding:13px 16px;border-radius:12px;font-weight:600;font-size:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow-sm);}
.btn-primary{background:var(--ink);background-image:linear-gradient(135deg,var(--ink),var(--ink-2));color:var(--cream);}
.btn-amber{background:var(--amber);background-image:linear-gradient(135deg,var(--amber),#ffb84d);color:var(--ink);box-shadow:0 4px 14px rgba(255,159,28,.35);}
.btn-outline{background:transparent;border:1px solid var(--ink);color:var(--ink);box-shadow:none;}
.btn-teal{background:var(--teal);background-image:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;}
.btn-ghost{background:var(--line);color:var(--ink);box-shadow:none;}
.btn-sm{padding:8px 12px;font-size:12px;width:auto;border-radius:9px;}
.btn-danger{background:var(--coral);color:#fff;}
.row-btns{display:flex;gap:8px;}

/* --- Forms --- */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:14px;}
.tabs{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:18px;}
.tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13px;font-weight:600;background:transparent;color:var(--muted);}
.tab.active{background:var(--ink);color:var(--cream);}

/* --- Bottom nav --- */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:40;}
.navitem{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);font-weight:600;flex:1;}
.navitem.active{color:var(--ink);}
.navitem .ic{font-size:18px;}

/* --- Urgent FAB --- */
.fab-urgent{position:fixed;bottom:78px;left:50%;transform:translateX(calc(-50%+170px));width:58px;height:58px;border-radius:50%;background:var(--amber);background-image:linear-gradient(135deg,var(--amber),#ffb84d);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:9px;font-weight:700;box-shadow:0 8px 20px rgba(255,159,28,.5);z-index:41;}
.fab-urgent .ic{font-size:20px;line-height:1;}
.fab-urgent::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--amber);opacity:.55;animation:pulse 1.8s ease-out infinite;}
@keyframes pulse{0%{transform:scale(.85);opacity:.6;}100%{transform:scale(1.5);opacity:0;}}

/* --- Login hero --- */
.hero-panel{background:linear-gradient(160deg,var(--ink) 0%, var(--ink-2) 55%, var(--teal-dark) 130%);border-radius:24px;padding:34px 20px 30px;text-align:center;margin-bottom:22px;box-shadow:var(--shadow-md);}
.hero-panel h1{color:var(--cream);font-size:30px;margin:14px 0 4px;letter-spacing:-.02em;}
.hero-panel .tag{color:rgba(247,242,231,.75);font-size:13px;font-weight:600;letter-spacing:.01em;}

/* --- Feed cards --- */
.tasker-card{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
.avatar{width:56px;height:56px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:#fff;font-size:18px;}
.name-link{font-weight:700;font-size:15px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--line);color:var(--ink);margin-right:4px;text-transform:uppercase;letter-spacing:.03em;}
.pill.online{background:rgba(15,155,142,.12);color:var(--teal);}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:3px 7px;border-radius:8px;background:#FFF3E0;color:var(--amber-dark);margin-right:4px;margin-top:4px;}

/* --- Gallery --- */
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.ba{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-align:center;}

/* --- Stepper --- */
.stepper{display:flex;flex-direction:column;gap:0;}
.step{display:flex;gap:12px;position:relative;padding-bottom:26px;}
.step:last-child{padding-bottom:0;}
.step .node{width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;z-index:1;}
.step.done .node{background:var(--teal);color:#fff;}
.step.current .node{background:var(--amber);color:var(--ink);}
.step:not(:last-child)::before{content:'';position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line);}
.step.done:not(:last-child)::before{background:var(--teal);}
.step .txt b{display:block;font-size:14px;}
.step .txt span{font-size:12px;color:var(--muted);}

/* --- Map mock --- */
.mapbox{position:relative;height:340px;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,#E9E4D6,#DDD7C4);border:1px solid var(--line);}
.pin{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.pin.off{background:var(--muted);}
.heat{position:absolute;border-radius:50%;filter:blur(18px);opacity:.55;pointer-events:none;}

/* --- Table (admin) --- */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:6px 6px;border-bottom:1px solid var(--line);}
td{padding:8px 6px;border-bottom:1px solid var(--line);}
.sidebar-btn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink);width:100%;text-align:left;background:transparent;}
.sidebar-btn.active{background:var(--ink);color:var(--cream);}

/* --- Toast --- */
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;box-shadow:0 8px 20px rgba(0,0,0,.25);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.section-title{font-family:'Space Grotesk';font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px;}
.stars{color:var(--amber-dark);font-size:13px;}
.link{color:var(--ink);text-decoration:underline;font-weight:600;font-size:13px;background:none;}
.overlay{position:fixed;inset:0;background:rgba(20,20,43,.55);z-index:70;display:flex;align-items:flex-end;}
.sheet{background:var(--cream);width:100%;max-width:460px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ================= FIREBASE SETUP =================
   Paste your config from Firebase Console → Project settings → Your apps.
   Until you fill this in, the app runs on local mock data (as before) so it
   still works standalone. Once filled in, it automatically switches to
   live Firebase for auth + data. */
const firebaseConfig = {
  apiKey: "AIzaSyDV1z1NV0bZL_VlnPASpRncNaz3AWKocqc",
  authDomain: "taskflowgo-3e6e8.firebaseapp.com",
  projectId: "taskflowgo-3e6e8",
  storageBucket: "taskflowgo-3e6e8.firebasestorage.app",
  messagingSenderId: "709378818627",
  appId: "1:709378818627:web:93b894e162c86ba0cc8af6",
  measurementId: "G-0R6NTQNJ1W"
};
const FB_ENABLED = !!firebaseConfig.apiKey;
let fbAuth = null, db = null;
if (FB_ENABLED) {
  firebase.initializeApp(firebaseConfig);
  fbAuth = firebase.auth();
  db = firebase.firestore();
}

/* ================= LOGO ================= */
// Monogram mark: the "T" crossbar bends downward into a checkmark stroke —
// reads as "Task -> Done" in one continuous line. Navy-to-teal gradient badge
// (premium/sleek), warm cream stroke + soft rounded corners (approachable/trustworthy).
function LOGO_SVG(size){
  const uid = 'lg'+Math.floor(Math.random()*100000);
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" style="display:block;flex-shrink:0;">
    <defs>
      <linearGradient id="${uid}" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#1B1B3D"/>
        <stop offset="1" stop-color="#0F9B8E"/>
      </linearGradient>
    </defs>
    <rect width="40" height="40" rx="13" fill="url(#${uid})"/>
    <rect x="10" y="10" width="20" height="5" rx="2.5" fill="#F7F2E7"/>
    <path d="M20 12.5 V21" stroke="#F7F2E7" stroke-width="5" stroke-linecap="round"/>
    <path d="M12.5 21.5 L18.5 27.5 L29 15.5" stroke="#FF9F1C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>`;
}

/* ================= MOCK DATA ================= */
const CATS = ['Cleaning','Plumbing','Electrical','Handyman','Moving','Gardening','Car Wash'];
const AV_COLORS = ['#FF9F1C','#0F9B8E','#E85C4A','#5B5FEE','#C9862D','#2E9C6B','#B85C9E'];
const BA_COLORS = ['#DDBEA9','#B7B7A4','#A5A58D','#6B705C','#CB997E','#FFE8D6'];

function mkTasker(id,name,category,priceFrom,rating,reviewsCount,avgReply,badges,online,lastActive,trustScore,completedJobs,bio){
  return {id,name,category,priceFrom,rating,reviewsCount,avgReply,badges,online,lastActive,trustScore,completedJobs,bio,
    avatarColor:AV_COLORS[id%AV_COLORS.length],
    services:[{name:category+' — Standard',price:priceFrom},{name:category+' — Deep/Full Job',price:priceFrom+Math.round(priceFrom*0.8)}],
    reviews:[
      {author:'Nomvula K.',rating:5,text:'On time and thorough. Would book again.'},
      {author:'Deon P.',rating:4,text:'Good work, communicated well throughout.'}
    ],
    lat: 20+Math.random()*260, lng: 20+Math.random()*380,
    quickAvailable: Math.random()>0.5
  };
}
let taskers = [
  mkTasker(1,'Sarah Mokoena','Cleaning',250,4.8,120,'8 min',['Verified Cleaner'],true,'now',92,120,'Detail-obsessed home cleaner. 5+ years experience, own equipment & eco products.'),
  mkTasker(2,'Themba Nkosi','Plumbing',400,4.9,86,'15 min',['Certified Electrician'.replace('Electrician','Plumber')],true,'now',95,86,'Licensed plumber. Leaks, geysers, installations — quick response guaranteed.'),
  mkTasker(3,'Riaan Botha','Electrical',450,4.7,64,'20 min',['Certified Electrician'],false,'2h ago',89,64,'Registered electrician for households and small businesses.'),
  mkTasker(4,'Lindiwe Dlamini','Handyman',300,4.6,45,'25 min',['Pro Handyman'],true,'now',85,45,'General repairs, furniture assembly, mounting and small fixes.'),
  mkTasker(5,'CleanCo (Pty) Ltd','Cleaning',600,4.9,210,'10 min',['Verified Cleaner','Business Service'],true,'now',97,210,'Professional cleaning company serving offices and Airbnb hosts.'),
  mkTasker(6,'Pieter van Wyk','Moving',550,4.5,38,'30 min',['Pro Handyman'],false,'5h ago',80,38,'Reliable moving team, own bakkie & trolley, careful with belongings.'),
  mkTasker(7,'Ayanda Zulu','Gardening',200,4.7,52,'18 min',[],true,'now',87,52,'Lawn care, hedge trimming and general garden maintenance.'),
];

let state = {
  view:'login', role:null, user:null,
  loginTab:'user',
  tasks:[],
  selectedTaskerId:null,
  selectedTaskId:null,
  taskerHomeTab:'requests',
  adminSection:'dashboard',
  mapHeat:false,
  urgentSheetOpen:false,
  taskIdSeq:1000,
  categories:[...CATS],
  commission:5, cashFee:2,
  notif:[],
};

let mockUsers = [
  {name:'John Smith',email:'john@mail.com',jobs:12,completed:10,cancelled:2,rating:4.7,status:'active'},
  {name:'Aisha Patel',email:'aisha@mail.com',jobs:5,completed:5,cancelled:0,rating:5.0,status:'active'},
  {name:'Kabelo Sithole',email:'kabelo@mail.com',jobs:3,completed:1,cancelled:2,rating:3.2,status:'flagged'},
];
let disputes = [
  {id:'D-241',task:'Cleaning — #T1042',user:'John Smith',tasker:'Sarah Mokoena',reason:'Job left incomplete',status:'open'},
];
let payments = [
  {id:'PAY-8821',user:'John Smith',tasker:'Sarah Mokoena',amount:250,commission:12.5,status:'released'},
  {id:'PAY-8822',user:'Aisha Patel',tasker:'Themba Nkosi',amount:400,commission:20,status:'held'},
];

/* ================= HELPERS ================= */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2200);
}
function stars(n){ const f=Math.round(n); return '★'.repeat(f)+'☆'.repeat(5-f); }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function go(view){ state.view=view; render(); window.scrollTo(0,0); }
function findTasker(id){ return taskers.find(t=>t.id===id); }
function findTask(id){ return state.tasks.find(t=>t.id===id); }

/* ================= AUTH ================= */
function doLogin(){
  const email = document.getElementById('li-email').value.trim();
  const pass = document.getElementById('li-pass').value;
  if(!email || !pass){ toast('Enter email and password'); return; }

  if(FB_ENABLED){
    fbAuth.signInWithEmailAndPassword(email, pass)
      .then(async cred => {
        const udoc = await db.collection('users').doc(cred.user.uid).get();
        if(!udoc.exists){ toast('No profile found for this login'); return; }
        const u = udoc.data();
        state.role = u.role; state.user = { uid: cred.user.uid, ...u };
        if(u.role==='admin') go('admin');
        else if(u.role==='tasker') go('taskerHome');
        else go('home');
        toast('Welcome back, '+u.name);
      })
      .catch(err => toast(err.message));
    return;
  }

  // --- local demo fallback (no Firebase configured) ---
  if(email.toLowerCase()==='admin@taskflowgo.com'){
    state.role='admin'; state.user={name:'Platform Admin',email};
    go('admin'); toast('Welcome back, Admin'); return;
  }
  if(state.loginTab==='tasker'){
    state.role='tasker';
    state.user = taskers[0];
    go('taskerHome'); toast('Welcome back, '+state.user.name);
  } else {
    state.role='user';
    state.user = {name: email.split('@')[0].replace(/\./g,' ') || 'User', email};
    go('home'); toast('Welcome back!');
  }
}

function doRegister(kind){
  const name = document.getElementById('rg-name').value.trim();
  const email = document.getElementById('rg-email').value.trim();
  const pass = FB_ENABLED ? document.getElementById('rg-pass').value : null;
  if(!name||!email||(FB_ENABLED && !pass)){ toast('Fill in your details'); return; }

  if(FB_ENABLED){
    fbAuth.createUserWithEmailAndPassword(email, pass)
      .then(async cred => {
        const uid = cred.user.uid;
        const userDoc = { name, email, role: kind, status:'active', createdAt: firebase.firestore.FieldValue.serverTimestamp() };
        await db.collection('users').doc(uid).set(userDoc);
        if(kind==='tasker'){
          const cat = document.getElementById('rg-cat').value;
          const price = Number(document.getElementById('rg-price').value)||200;
          const taskerDoc = { name, category:cat, priceFrom:price, bio:'New tasker on Task.',
            services:[{name:cat+' — Standard', price}], badges:[], online:true, quickAvailable:false,
            trustScore:70, completedJobs:0, rating:5.0, avgReplyMinutes:'—', verified:false };
          await db.collection('taskers').doc(uid).set(taskerDoc);
          state.role='tasker'; state.user={uid, ...userDoc, ...taskerDoc};
          go('taskerHome');
        } else {
          state.role='user'; state.user={uid, ...userDoc};
          go('home');
        }
        toast('Account created — welcome to Task!');
      })
      .catch(err => toast(err.message));
    return;
  }

  // --- local demo fallback ---
  if(kind==='tasker'){
    const cat = document.getElementById('rg-cat').value;
    const price = Number(document.getElementById('rg-price').value)||200;
    const nt = mkTasker(taskers.length+1,name,cat,price,5.0,0,'—',[],true,'now',70,0,'New tasker on Task.');
    taskers.push(nt);
    state.role='tasker'; state.user=nt;
    go('taskerHome'); toast('Tasker account created — welcome!');
  } else {
    state.role='user'; state.user={name,email};
    go('home'); toast('Account created — welcome to Task!');
  }
}

function logout(){
  if(FB_ENABLED) fbAuth.signOut();
  state.role=null; state.user=null; go('login');
}

/* ================= TASK ACTIONS ================= */
function requestTasker(taskerId){
  const t = findTasker(taskerId);
  if(FB_ENABLED){
    db.collection('tasks').add({
      userId: state.user.uid, taskerId: String(taskerId), category:t.category, price:t.priceFrom,
      status:'accepted', step:0, isUrgent:false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(ref=>{ toast('Request sent to '+t.name); state.selectedTaskId=ref.id; go('taskDetail'); });
    return;
  }
  const id = 'T'+(state.taskIdSeq++);
  state.tasks.unshift({id, taskerId, category:t.category, price:t.priceFrom, status:'Pending', isUrgent:false, step:0, createdAt:'Just now'});
  toast('Request sent to '+t.name);
  go('taskDetail'); state.selectedTaskId=id;
}

function submitUrgent(){
  const cat = document.getElementById('ug-cat').value;
  const price = Number(document.getElementById('ug-price').value)||0;
  if(!price){ toast('Set a price for the job'); return; }
  const nearby = taskers.filter(t=>t.online && t.category===cat).length || 3;

  if(FB_ENABLED){
    db.collection('tasks').add({
      userId: state.user.uid, taskerId: null, category:cat, price, status:'pending', step:0,
      isUrgent:true, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(ref=>{
      state.urgentSheetOpen=false; toast('⚡ Alert sent to '+nearby+' nearby taskers');
      state.selectedTaskId=ref.id; go('taskDetail');
      // Real acceptance happens when a tasker runs acceptUrgentTask() below (Firestore transaction).
    });
    return;
  }

  const id='T'+(state.taskIdSeq++);
  state.tasks.unshift({id, taskerId:null, category:cat, price, status:'Alerting nearby taskers', isUrgent:true, step:0, createdAt:'Just now'});
  state.urgentSheetOpen=false;
  toast('⚡ Alert sent to '+nearby+' nearby taskers');
  state.selectedTaskId=id; go('taskDetail');
  setTimeout(()=>{
    const task=findTask(id);
    if(task && task.status==='Alerting nearby taskers'){
      const pool=taskers.filter(t=>t.category===cat);
      const winner = pool[Math.floor(Math.random()*pool.length)] || taskers[0];
      task.taskerId = winner.id; task.status='Accepted'; task.step=0;
      if(state.view==='taskDetail') render();
      toast(winner.name+' accepted the urgent job!');
    }
  },2600);
}

// Runs as a Firestore transaction so two taskers can't both accept the same urgent job.
function acceptUrgentTask(taskId){
  if(!FB_ENABLED) return;
  const ref = db.collection('tasks').doc(taskId);
  db.runTransaction(async tx=>{
    const doc = await tx.get(ref);
    if(!doc.exists || doc.data().taskerId) throw new Error('Already taken');
    tx.update(ref, { taskerId: state.user.uid, status:'accepted' });
  }).then(()=> toast('You accepted the job!'))
    .catch(()=> toast('Someone else already accepted this one'));
}

function advanceStep(taskId){
  if(FB_ENABLED){
    const t = findTask(taskId);
    const next = Math.min((t.step||0)+1, 4);
    const statusMap = ['accepted','on_the_way','arrived','started','finished'];
    db.collection('tasks').doc(taskId).update({ step: next, status: statusMap[next] });
    return;
  }
  const t=findTask(taskId);
  if(!t) return;
  if(t.step<4){ t.step++; t.status = ['Accepted','Tasker on the way','Tasker arrived','Work started','Work finished'][t.step]; }
  render();
}
function submitReview(taskId){
  const rating = window._reviewRating||5;
  const text = document.getElementById('rv-text').value;
  toast('Review submitted — thanks!');
  const t=findTask(taskId); t.reviewed=true;
  go('home');
}

  paint();
  spans.forEach(s=> s.onclick = ()=>{ window._reviewRating = Number(s.dataset.star); paint(); });
}

  if(sec==='dashboard'){
    body = `<div class="stat-grid">
      <div class="stat"><div class="n">${mockUsers.length+341}</div><div class="l">Total users</div></div>
      <div class="stat"><div class="n">${taskers.length+80}</div><div class="l">Total taskers</div></div>
      <div class="stat"><div class="n">${state.tasks.filter(t=>t.step<4).length}</div><div class="l">Active tasks</div></div>
      <div class="stat"><div class="n">${state.tasks.filter(t=>t.step>=4).length+1209}</div><div class="l">Completed tasks</div></div>
      <div class="stat"><div class="n mono">R120,450</div><div class="l">Platform revenue</div></div>
      <div class="stat"><div class="n">${disputes.filter(d=>d.status==='open').length}</div><div class="l">Pending disputes</div></div>
    </div>`;
  } else if(sec==='users'){
    body = `<table><tr><th>Name</th><th>Jobs</th><th>Rating</th><th>Status</th><th></th></tr>
      ${mockUsers.map((u,i)=>`<tr><td>${u.name}</td><td>${u.completed}/${u.jobs}</td><td>${u.rating}</td><td>${u.status}</td>
      <td><button class="btn btn-sm btn-danger" onclick="mockUsers[${i}].status='suspended';render()">Suspend</button></td></tr>`).join('')}
    </table>`;
  } else if(sec==='taskers'){
    body = `<table><tr><th>Name</th><th>Category</th><th>Trust</th><th>Jobs</th><th></th></tr>
      ${taskers.map((t,i)=>`<tr><td>${t.name}</td><td>${t.category}</td><td>${t.trustScore}%</td><td>${t.completedJobs}</td>
      <td><button class="btn btn-sm btn-teal" onclick="toast('${t.name} approved')">Approve</button></td></tr>`).join('')}
    </table>`;
  } else if(sec==='tasks'){
    body = state.tasks.length ? `<table><tr><th>ID</th><th>Category</th><th>Price</th><th>Status</th></tr>
      ${state.tasks.map(t=>`<tr><td class="mono">${t.id}</td><td>${t.category}${t.isUrgent?' ⚡':''}</td><td class="mono">R${t.price}</td><td>${t.status}</td></tr>`).join('')}
    </table>` : `<div class="empty">No live tasks yet.</div>`;
  } else if(sec==='payments'){
    body = `<table><tr><th>ID</th><th>User</th><th>Tasker</th><th>Amt</th><th>Status</th></tr>
      ${payments.map(p=>`<tr><td class="mono">${p.id}</td><td>${p.user}</td><td>${p.tasker}</td><td class="mono">R${p.amount}</td><td>${p.status}</td></tr>`).join('')}
    </table>
    <div class="section-title">Commission settings</div>
    <div class="card">
      <div class="field"><label>Standard commission (%)</label><input type="number" value="${state.commission}" onchange="state.commission=Number(this.value)"></div>
      <div class="field"><label>Cash transaction fee (%)</label><input type="number" value="${state.cashFee}" onchange="state.cashFee=Number(this.value)"></div>
    </div>`;
  } else if(sec==='disputes'){
    body = disputes.map((d,i)=>`<div class="card">
      <b>${d.id}</b> — ${d.task}<div style="font-size:12px;color:var(--muted);margin:4px 0;">${d.user} vs ${d.tasker}: "${d.reason}"</div>
      <span class="pill">${d.status}</span>
      <div class="row-btns" style="margin-top:8px;">
        <button class="btn btn-sm btn-teal" onclick="disputes[${i}].status='refunded';render()">Refund user</button>
        <button class="btn btn-sm btn-outline" onclick="disputes[${i}].status='paid tasker';render()">Pay tasker</button>
      </div></div>`).join('') || `<div class="empty">No disputes.</div>`;
  } else if(sec==='reviews'){
    body = taskers.flatMap(t=>t.reviews.map(r=>({...r,tasker:t.name}))).map(r=>`<div class="card">
      <div style="display:flex;justify-content:space-between;"><b>${r.author} → ${r.tasker}</b><span class="stars">${stars(r.rating)}</span></div>
      <p style="font-size:13px;color:var(--muted);margin:4px 0 8px;">${r.text}</p>
      <button class="btn btn-sm btn-danger" onclick="toast('Review removed')">Remove</button>
    </div>`).join('');
  } else if(sec==='categories'){
    body = `<div class="card">
      ${state.categories.map((c,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);"><span>${c}</span><button class="btn btn-sm btn-danger" onclick="state.categories.splice(${i},1);render()">Remove</button></div>`).join('')}
      <div class="row-btns" style="margin-top:10px;">
        <input id="new-cat" placeholder="New category" style="flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);">
        <button class="btn btn-sm btn-primary" onclick="const v=document.getElementById('new-cat').value.trim(); if(v){state.categories.push(v);render();}">Add</button>
      </div>
    </div>`;
  } else if(sec==='settings'){
    body = `<div class="card">
      <div class="field"><label>Minimum job price (R)</label><input type="number" value="100"></div>
      <div class="field"><label>Maximum job price (R)</label><input type="number" value="5000"></div>
      <div class="field"><label>OTP verification</label><select><option>Required</option><option>Optional</option></select></div>
      <button class="btn btn-primary" onclick="toast('Settings saved')">Save settings</button>
    </div>
    <div class="section-title">Broadcast notification</div>
    <div class="card">
      <textarea id="admin-notif" rows="2" placeholder="Message to all users/taskers…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);"></textarea>
      <button class="btn btn-outline" style="margin-top:8px;" onclick="toast('Notification sent to all users & taskers')">Send to everyone</button>
    </div>`;
  }
  return `
  <div class="container" style="padding-top:14px;padding-bottom:20px;">
    <div class="topbar" style="padding:0 0 10px;">
      <div class="brand">${LOGO_SVG(28)}<h1 style="font-size:17px;">Admin Control Panel</h1></div>
      <button class="btn btn-sm btn-ghost" onclick="logout()">Log out</button>
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;">
      ${sections.map(s=>`<button class="sidebar-btn ${sec===s?'active':''}" style="white-space:nowrap;width:auto;" onclick="state.adminSection='${s}';render()">${labels[s]}</button>`).join('')}
    </div>
    ${body}
  </div>`;
}

/* ================= FIREBASE: LIVE LISTENERS & SEEDING ================= */
if (FB_ENABLED) {
  // Keep the user logged in across refreshes, and load live data once auth state resolves.
  fbAuth.onAuthStateChanged(async user => {
    if (user && !state.user) {
      const udoc = await db.collection('users').doc(user.uid).get();
      if (udoc.exists) {
        const u = udoc.data();
        state.role = u.role; state.user = { uid: user.uid, ...u };
        go(u.role==='admin' ? 'admin' : (u.role==='tasker' ? 'taskerHome' : 'home'));
      }
    }
  });

  // Live tasker list — replaces the hardcoded `taskers` array once data exists.
  db.collection('taskers').onSnapshot(snap => {
    if (snap.empty) return; // nothing seeded yet — keep showing demo taskers
    taskers.length = 0;
    snap.forEach(doc => taskers.push({ id: doc.id, avatarColor: AV_COLORS[taskers.length % AV_COLORS.length], ...doc.data() }));
    render();
  });

  // Live task list for the signed-in user (as poster or as assigned tasker).
  db.collection('tasks').onSnapshot(snap => {
    const rows = [];
    snap.forEach(doc => rows.push({ id: doc.id, ...doc.data() }));
    state.tasks = rows;
    if (['home','tasks','taskDetail','taskerHome'].includes(state.view)) render();
  });

  // One-time helper: run seedDemoData() once in the browser console (or wire a button)
  // to copy this file's mock taskers/categories into your real Firestore project.
  window.seedDemoData = async function () {
    const batch = db.batch();
    taskers.forEach(t => {
      const ref = db.collection('taskers').doc();
      batch.set(ref, { name:t.name, category:t.category, priceFrom:t.priceFrom, bio:t.bio,
        services:t.services, badges:t.badges, online:t.online, quickAvailable:!!t.quickAvailable,
        trustScore:t.trustScore, completedJobs:t.completedJobs, rating:t.rating, avgReplyMinutes:t.avgReply, verified:true });
    });
    batch.set(db.collection('meta').doc('categories'), { list: CATS });
    batch.set(db.collection('meta').doc('settings'), { commissionPct:5, cashFeePct:2, minPrice:100, maxPrice:5000 });
    await batch.commit();
    toast('Demo data seeded into Firestore ✅');
  };
}

render();
</script>
</body>
</html>
